<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours - Diaporama</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Menu des thèmes -->
    <div class="theme-menu" id="theme-menu">
        <h1>📚 Sélectionne un thème</h1>
        <div class="theme-list" id="theme-list">
            <!-- Rempli dynamiquement par JS -->
        </div>
    </div>

    <!-- Container des slides (caché au départ) -->
    <div class="slideshow-container" id="slideshow-container" style="display: none;">
        <!-- Bouton retour -->
        <button class="back-btn" id="back-btn" onclick="showThemeMenu()">← Retour aux thèmes</button>

        <!-- Bouton Sommaire -->
        <button class="sommaire-btn" id="sommaire-btn" title="Sommaire (S)">☰ Sommaire</button>
        
        <!-- Titre du thème -->
        <h2 class="theme-title" id="theme-title"></h2>

        <!-- Contenu de la slide -->
        <div class="slide-content" id="slide-content">
            <!-- Contenu chargé dynamiquement -->
        </div>

        <!-- Navigation -->
        <div class="nav-controls">
            <button id="prev-btn" onclick="changeSlide(-1)">← Précédent</button>
            <div class="slide-counter-wrapper">
                <span id="slide-counter" class="slide-counter-clickable" title="Cliquer pour aller à une slide (ou appuyer sur G)">1 / 1</span>
                <!-- Sélecteur de slide -->
                <div class="slide-picker" id="slide-picker">
                    <label>Aller à la slide :</label>
                    <div class="slide-picker-input-group">
                        <input type="number" id="slide-picker-input" min="1" max="1" value="1">
                        <span class="slide-picker-separator">/</span>
                        <span id="slide-picker-total">1</span>
                    </div>
                    <button id="slide-picker-go" class="slide-picker-btn">OK</button>
                </div>
            </div>
            <button id="next-btn" onclick="changeSlide(1)">Suivant →</button>
        </div>

        <!-- Overlay Sommaire -->
        <div class="sommaire-overlay" id="sommaire-overlay">
            <div class="sommaire-content">
                <h3>Sommaire</h3>
                <ul id="sommaire-list">
                    <!-- Généré dynamiquement -->
                </ul>
                <button class="sommaire-close" id="sommaire-close">Fermer (Échap)</button>
            </div>
        </div>
    </div>

    <!-- Indicateur de progression -->
    <div class="progress-bar" id="progress-bar" style="display: none;">
        <div class="progress" id="progress"></div>
    </div>

    <script src="js/themes-data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
