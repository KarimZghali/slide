<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours - Diaporama</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Menu des thèmes -->
    <div class="theme-menu" id="theme-menu">
        <h1>📚 Sélectionne un thème</h1>
        <div class="theme-list" id="theme-list">
            <!-- Rempli dynamiquement par JS -->
        </div>
    </div>

    <!-- Container des slides (caché au départ) -->
    <div class="slideshow-container" id="slideshow-container" style="display: none;">
        <!-- Bouton retour -->
        <button class="back-btn" id="back-btn" onclick="showThemeMenu()">← Retour aux thèmes</button>
        
        <!-- Titre du thème -->
        <h2 class="theme-title" id="theme-title"></h2>

        <!-- Contenu de la slide -->
        <div class="slide-content" id="slide-content">
            <!-- Contenu chargé dynamiquement -->
        </div>

        <!-- Navigation -->
        <div class="nav-controls">
            <button id="prev-btn" onclick="changeSlide(-1)">← Précédent</button>
            <span id="slide-counter">1 / 1</span>
            <button id="next-btn" onclick="changeSlide(1)">Suivant →</button>
        </div>
    </div>

    <!-- Indicateur de progression -->
    <div class="progress-bar" id="progress-bar" style="display: none;">
        <div class="progress" id="progress"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
